[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-manifold"
version = "0.1.0"
description = "Leakage-controlled shared computational manifold experiments."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.14.0",
  "datasets==4.8.5",
  "huggingface-hub[hf-xet]==0.36.0",
  "matplotlib==3.10.9",
  "modelscope==1.39.1",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "peft==0.20.0",
  "psutil==7.2.2",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "safetensors==0.8.0",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "statsmodels==0.14.6",
  "torch==2.13.0",
  "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
  "pip-tools==7.6.1",
  "pytest==8.4.2",
  "ruff==0.16.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA-capable GPU and performs a real CUDA operation",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
